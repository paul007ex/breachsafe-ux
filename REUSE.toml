version = 1

# breachsafe-ux: the OSS UX host, Apache-2.0 (relicensed #19) as a deliberate exception to the
# BreachSAFE PolyForm-Noncommercial default so it can be a public shared dependency of the OSS
# QuReddy [ux]. This file provides coverage for files that don't carry an inline SPDX header.

[[annotations]]
path = [
  "src/**", "tests/**", "tools/**", "docs/**", "scripts/**", "CHANGELOG.md",
  "README.md", "NOTICE", ".gitignore", "*.dockerignore", ".python-version",
  ".jscpd.json", "pyproject.toml", "uv.lock",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 BreachSAFE <https://www.breachsafe.io>"
SPDX-License-Identifier = "Apache-2.0"

# Third-party: Lucide icon set (ISC) — kept under its original license, not relabelled.
[[annotations]]
path = ["src/breachsafe_ux/assets/icons/**"]
precedence = "override"
SPDX-FileCopyrightText = "Lucide Contributors <https://lucide.dev>"
SPDX-License-Identifier = "ISC"

# Canonical BreachSAFE skills (installed from breachsafe-skills, issue #37). These are
# first-party BreachSAFE tooling under the standing PolyForm-Noncommercial default and keep
# that origin license, so they carry PolyForm-Noncommercial-1.0.0 while the host repo is
# Apache-2.0. Copied verbatim for both agent layouts (.claude + .agents). "aggregate"
# precedence lets any file with its own inline SPDX header keep it; this fills the rest.
[[annotations]]
path = [".claude/skills/**", ".agents/skills/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 BreachSAFE"
SPDX-License-Identifier = "PolyForm-Noncommercial-1.0.0"
