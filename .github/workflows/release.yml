#
# Signed release pipeline (#34). On a published GitHub Release: build the wheel + sdist,
# `twine check`, attest SLSA build provenance, cosign-sign each artifact (keyless OIDC), upload
# the signed artifacts to the Release, then a verify-signing job re-reads the Release and FAILS
# unless the wheel and sdist each carry a .sigstore bundle — so "the signing step silently did
# not run" can never ship quietly (adapted from breachsafe/qureddy, #219/#232).
#
# Release flow: bump version (PR) -> `git push` tag vX.Y.Z (builds the EnXemble image) ->
# `gh release create vX.Y.Z` (or the Releases UI) -> this workflow signs + attaches artifacts.
#
# breachsafe-ux is Docker-first and is NOT published to PyPI or TestPyPI (only qureddy publishes
# to TestPyPI). The signed wheel + sdist are attached to the GitHub Release as downloadable,
# provenance-attested assets; there is no package-index publish step.
name: release

on:
  release:
    types: [published]     # cut a GitHub Release -> auto-sign + publish
  workflow_dispatch:        # or run it by hand from the Actions tab

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build wheel + sdist (signed)
    runs-on: ubuntu-latest
    permissions:
      contents: write        # upload signed artifacts as GitHub Release assets
      id-token: write        # OIDC for the SLSA provenance attestation + cosign keyless
      attestations: write    # write the attestation to the repo's attestation store
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify canonical release repository
        # GitHub org/repo names are case-insensitive; GITHUB_REPOSITORY preserves the canonical
        # display casing, so lower-case before comparing.
        run: test "$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')" = "breachsafe/enxemble"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Build distributions
        run: uv build   # -> dist/*.whl + dist/*.tar.gz
      - name: Check with twine
        # twine 7.0.0: earlier pins (6.2.0) reject Metadata-Version 2.5 emitted by current uv build
        # ("'2.5' is not a valid metadata version"), which failed the release. 7.0.0 accepts it.
        run: uv tool run --from "twine==7.0.0" twine check dist/*
      # SLSA build provenance for the wheel + sdist. Verifiable with
      # `gh attestation verify <file> --repo paul007ex/breachsafe-ux`.
      - name: Attest build provenance for the distributions
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"
      # Signed-Releases: cosign keyless OIDC signature bundles attached to the GitHub Release so
      # OpenSSF Scorecard can discover a signature next to each asset. Only meaningful on
      # `release: published` (workflow_dispatch has no release tag).
      - name: Install cosign
        if: github.event_name == 'release'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign distributions with cosign (keyless OIDC)
        if: github.event_name == 'release'
        run: |
          for f in dist/*; do
            cosign sign-blob --yes --bundle "$f.sigstore" "$f"
          done
      - name: Upload signed distributions to the GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        # #175: the tag flows through env, never interpolated into the run: script text, so a tag
        # name containing shell metacharacters cannot inject commands.
        run: gh release upload "$TAG" dist/* --clobber

  # Enforcement: a signing STEP existing in the build job does NOT prove it RAN. This job runs
  # AFTER build has signed + uploaded, re-reads the just-published GitHub Release, and FAILS the
  # workflow unless the wheel and sdist each carry a .sigstore bundle.
  verify-signing:
    name: verify release is signed
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read         # gh release view / download + gh attestation verify
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify the published release is actually signed
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
        # #175: tag + repo through env, not interpolated into the run: script text.
        run: bash scripts/verify_release_signed.sh "$TAG" "$REPO"
