#
# Release gate (#29) — the single authoritative gate that reproduces every
# blocking check for a release candidate (lint, type-check, tests, file-size
# policy, single-source version check, reuse compliance, build, secret scan)
# under a checksum-pinned uv with uv run --locked.
#
# NOT a per-PR gate (#118): ci.yml is the PR gate. This runs only for release
# candidates — pushes to main / version tags, PRs targeting a release/** branch,
# any PR carrying the `release` label, or a manual workflow_dispatch. The job is
# guarded so ordinary PRs to main trigger nothing expensive (they short-circuit).

name: release-gate

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-gate:
    name: Local release gate (${{ matrix.os }})
    # Run for release candidates only, never every PR (#118): push to main/tags,
    # manual dispatch, PRs into a release/** branch, or a PR labeled `release`.
    if: >-
      github.event_name != 'pull_request' ||
      startsWith(github.base_ref, 'release/') ||
      contains(github.event.pull_request.labels.*.name, 'release')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]

    steps:
      - name: Checkout candidate history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Run repository release gate
        run: python scripts/release_gate.py
