#
# Build the breachsafe-ux BASE image, smoke-test it (starts + serves), scan it, and publish
# to GHCR. Single build per event (#117): on a publish event the image is built + pushed
# BY DIGEST once, that exact digest is smoke-tested and Trivy-scanned, and only then are the
# human tags (edge/latest/version) applied to it — so the published bytes ARE the tested bytes.
# On pull_request the image is built+loaded and tested locally, never pushed.
# Supply chain (#119): SLSA provenance + SBOM attestations, Trivy HIGH/CRITICAL gate,
# job-scoped packages:write, digest-pinned base images (see Dockerfile), OCI labels.
# The package is PRIVATE during dev (GHCR default) and made public at release (avoids the
# #252 trap of a surprise-public image). See ADR-0003.
name: container

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # scoped to this job (#119), not workflow-level
      id-token: write # keyless cosign signing (OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      # ---------- pull_request: build + load + scan + smoke, never push ----------
      - name: Build (load for smoke test)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          load: true
          tags: breachsafe-ux:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy scan — fail on HIGH/CRITICAL (PR image)
        if: github.event_name == 'pull_request'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: breachsafe-ux:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Smoke test — the base image starts and serves (PR image)
        if: github.event_name == 'pull_request'
        run: |
          docker run -d --name ux -p 7860:7860 breachsafe-ux:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:7860/ >/dev/null 2>&1; then echo "up after ${i}s"; break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:7860/ >/dev/null || { echo "did not serve"; docker logs ux; exit 1; }
          docker rm -f ux

      # ---------- push / tag / dispatch: single build+push by digest, test, then tag ----------
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata (version + created)
        if: github.event_name != 'pull_request'
        id: meta
        run: |
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "version=${{ github.ref_type == 'tag' && github.ref_name || 'edge' }}" >> "$GITHUB_OUTPUT"

      - name: Build + push by digest (provenance + SBOM)
        if: github.event_name != 'pull_request'
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: true
          sbom: true
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.created=${{ steps.meta.outputs.created }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy scan — fail on HIGH/CRITICAL (pushed digest)
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Smoke test — the exact pushed image starts and serves
        if: github.event_name != 'pull_request'
        run: |
          REF="${IMAGE}@${{ steps.build.outputs.digest }}"
          docker run -d --name ux -p 7860:7860 "$REF"
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:7860/ >/dev/null 2>&1; then echo "up after ${i}s"; break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:7860/ >/dev/null || { echo "did not serve"; docker logs ux; exit 1; }
          docker rm -f ux

      - name: Tag the smoke-tested digest (edge on main; version + latest on release)
        if: github.event_name != 'pull_request'
        run: |
          docker buildx imagetools create \
            --tag "${IMAGE}:${{ github.ref_type == 'tag' && github.ref_name || 'edge' }}" \
            --tag "${IMAGE}:${{ github.ref_type == 'tag' && 'latest' || 'edge' }}" \
            "${IMAGE}@${{ steps.build.outputs.digest }}"

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the published digest (keyless)
        if: github.event_name != 'pull_request'
        run: cosign sign --yes "${IMAGE}@${{ steps.build.outputs.digest }}"
