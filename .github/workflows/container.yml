#
# Build the breachsafe-ux BASE image, smoke-test it (starts + serves), and push to GHCR.
# The package is PRIVATE during dev (GHCR default) and made public at release (avoids the
# #252 trap of a surprise-public image). See ADR-0003.
name: container

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Build (load for smoke test)
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          load: true
          tags: breachsafe-ux:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test — the base image starts and serves
        run: |
          docker run -d --name ux -p 7860:7860 breachsafe-ux:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:7860/ >/dev/null 2>&1; then echo "up after ${i}s"; break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:7860/ >/dev/null || { echo "did not serve"; docker logs ux; exit 1; }
          docker rm -f ux

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push (dev tag on main; version tag on release)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_type == 'tag' && github.ref_name || 'edge' }}
            ${{ env.IMAGE }}:${{ github.ref_type == 'tag' && 'latest' || 'edge' }}
          cache-from: type=gha
