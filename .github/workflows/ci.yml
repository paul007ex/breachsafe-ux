#
# Reproducible CI: every gate runs through `uv run --locked` against the committed uv.lock,
# so local and CI results match. Mirrors the qureddy discipline (static gates + tests), minus
# qureddy-specific bits (OpenSSL matrix, CBOM conformance, canonical provenance).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: "Static gates (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Install (locked)
        run: uv sync --locked --extra dev
      - name: ruff check
        run: uv run --locked ruff check .
      - name: ruff format --check
        run: uv run --locked ruff format --check .
      - name: mypy
        run: uv run --locked mypy src
      - name: bandit
        run: uv run --locked bandit -c pyproject.toml -r -ll src scripts
      - name: pip-audit
        run: uv run --locked pip-audit
      - name: deptry
        run: uv run --locked deptry .
      - name: reuse lint
        run: uv run --locked reuse lint
      - name: version single-source
        run: uv run --locked python scripts/bump_version.py --check

  test:
    name: "Tests (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Install (locked)
        run: uv sync --locked --extra dev
      - name: pytest (with coverage)
        run: >
          uv run --locked pytest -q
          --cov=breachsafe_ux --cov-fail-under=70
          --cov-report=term-missing --cov-report=xml:coverage.xml
          --junitxml=pytest-results.xml
      - name: upload test + coverage reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports-${{ matrix.os }}
          path: |
            coverage.xml
            pytest-results.xml
          if-no-files-found: warn
      - name: build (wheel + sdist)
        run: uv build
