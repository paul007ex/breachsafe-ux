name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: lint / type / test / build / reuse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project + dev tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install "pytest>=8" ruff mypy build "reuse[charset-normalizer]"

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Type-check (mypy)
        run: mypy src

      - name: Test (pytest)
        run: pytest tests/ -q

      - name: Build (wheel + sdist)
        run: python -m build

      - name: License compliance (reuse lint)
        run: reuse lint
