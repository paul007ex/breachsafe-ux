schema_version: 1
order: 1
id: qureddy
standalone: true
title: "HNDL Audit (TLS)"
run_label: "HNDL Audit (TLS)"
description: >-
  Audits a TLS endpoint for harvest-now-decrypt-later exposure. The assessment records the negotiated key exchange, whether a hybrid post-quantum option is available, certificate-chain signature algorithms, and legacy protocol offers. Use the evidence outputs to support remediation decisions; the scan reports observed protocol behavior and does not certify overall security. Runtime depends on probe count, timeout, retries, and endpoint responsiveness.

brand:
  product: "BreachSAFE QuReddy"
  version_cmd: ["qureddy", "--version"]   # single-source from the installed tool (#51)
  version: "0.2.x"                         # fallback if qureddy is not installed
  url: "https://www.breachsafe.io"
  repo: "https://github.com/breachsafe/qureddy"
  dependencies:
    - { label: "QuReddy", url: "https://github.com/breachsafe/qureddy" }
    - { label: "OpenSSL 3.5.7 LTS", url: "https://github.com/openssl/openssl/releases/tag/openssl-3.5.7" }
    - { label: "NIST PQC", url: "https://csrc.nist.gov/projects/post-quantum-cryptography" }
    - { label: "CycloneDX CBOM", url: "https://cyclonedx.org/capabilities/cbom/" }
    - { label: "Evidence export", url: "https://github.com/paul007ex/breachsafe-evidence-go" }
inputs:
  - name: host
    type: text
    label: "host"
    default: "pq.cloudflareresearch.com"
    placeholder: "pq.cloudflareresearch.com"
    info: "Required. Hostname, URL, or IP of the TLS endpoint."
    required: true
  - name: port
    type: int
    label: "port"
    default: 443
    min: 1
    max: 65535
    info: "TLS port. Defaults to 443."
  - name: timeout
    type: int
    label: "per-probe timeout (s)"
    widget: slider
    min: 1
    max: 300
    default: 30
    info: "Seconds per probe (1 to 300, default 30). A full scan runs several probes, so total time is a multiple of this."
    arg: "--timeout"
  - name: sni
    type: text
    label: "SNI override"
    placeholder: "one.one.one.one"
    info: "Optional. Recommended for name-based virtual hosts and IP targets."
    group: advanced
    arg: "--sni"
  - name: retries
    type: int
    label: "retries"
    widget: slider
    min: 0
    max: 3
    default: 0
    info: "Extra retry attempts on transient failure (0 to 3, default 0)."
    group: advanced
    arg: "--retries"
  - name: retry_delay
    type: float
    label: "retry delay (s)"
    widget: slider
    min: 0.0
    max: 10.0
    default: 1.0
    info: "Seconds between retries (0.0 to 10.0, default 1.0)."
    group: advanced
    arg: "--retry-delay"
  - name: deterministic
    type: bool
    label: "deterministic"
    default: false
    info: "Omit per-run identity (serial, timestamps, scan id) for a stable, diffable digest."
    group: advanced
    flag: "--deterministic"
  - name: verbosity
    type: int
    label: "log verbosity"
    widget: slider
    min: 0
    max: 3
    default: 1
    info: "Diagnostic log detail, shown in Raw log below. 0 = quiet, 1 = -v, 2 = -vv, 3 = -vvv (every subprocess start and completion)."
    repeat_flag: "-v"
run:
  base: [qureddy, scan, tls]
  # Docker fallback: when qureddy isn't on PATH (e.g. the Docker deployment), the engine runs
  # this image instead (docker run --pull=always). Local installs use the PATH binary.
  image: ghcr.io/breachsafe/qureddy:latest
  positional_from: "{host}:{port}"
  # #199: one scan writes both correlated documents into the run dir (qureddy --output-dir),
  # so the UI shows CBOM and JSON together with no format toggle and no second scan. The
  # engine reads each declared artifact; `primary` is the one the badge/posture validate against.
  output_dir_flag: "--output-dir"
  artifacts:
    - { name: cbom, file: scan.cdx.json, label: "CBOM", primary: true }
    - { name: json, file: scan.json,     label: "JSON (raw scan)" }
    # qureddy 0.2.59 (d630811 "emit complete scan artifact bundle with JSONL") writes four
    # files, not two. Declaring the other two gives each its own box with download and copy,
    # instead of leaving them on disk inside the container where nobody can reach them.
    #   scan.jsonl    Nuclei/ProjectDiscovery-shaped findings stream (template-id, type, host,
    #                 matched-at, url, port). This is the ingestable form: DefectDojo and the
    #                 rest of the posture fleet read that shape directly.
    #   scan.rich.txt the rendered CISO report, ANSI already stripped by the tool. Shareable
    #                 as-is, which the JSON forms are not.
    - { name: jsonl, file: scan.jsonl,    label: "Findings (JSONL, Nuclei-shaped)", language: null }
    - { name: rich,  file: scan.rich.txt, label: "Report (rendered text)", language: null }
  timeout_s: 180
validate:
  # Always validate the CBOM (the primary artifact): CycloneDX 1.7 schema-conformance. Run under
  # the same interpreter as the app (has cyclonedx), not a bare 'python' that may be absent.
  # exit 0 = valid, 1 = rejected, 3 = validator could not run -> unavailable, never a false verdict.
  argv:
    - "{python}"
    - -c
    - "import sys\ntry:\n from cyclonedx.schema import SchemaVersion\n from cyclonedx.validation.json import JsonStrictValidator\n r=JsonStrictValidator(SchemaVersion.V1_7).validate_str(open('{artifact}').read())\nexcept Exception as e:\n sys.stderr.write('validator-infra-error: '+repr(e)); sys.exit(3)\nsys.exit(0 if r is None else 1)"
  timeout_s: 30
  badge_rule:
    pass_if: { exit: 0 }
    fail_if: { exit: 1 }
    otherwise: unavailable
render:
  primary: cbom
  # #1: readiness posture comes from the scan FINDINGS, shown separately from the evidence badge.
  # A schema-valid CBOM (green badge) does NOT mean the endpoint is PQC-ready — this banner says
  # what the scan actually found. Values are the qureddy Readiness enum.
  # Reads qureddy 0.2.56's HNDL axis instead of the single rolled-up readiness.
  #
  # scan.readiness collapses five independent axes into one ordinal value, and its
  # precedence puts classically_weak first. The result: cloudflare.com, which negotiates
  # X25519MLKEM768, was banner'd "Classically weak: broken or legacy primitives in use"
  # in red, off two medium findings (TLS 1.0 and 1.1 accepted). The banner contradicted
  # the Evaluation box directly beneath it. See BreachSAFE/qureddy#453.
  #
  # This is the HNDL question only: is recorded traffic decryptable later. Whether the
  # endpoint is exploitable TODAY is a different question, carried by hygiene_status and
  # shown in the Evaluation box. scan.readiness stays in the artifact untouched.
  posture:
    from: "qureddy:scan.hndl_exposure"
    cases:
      at_risk:              { text: "Audit finding: classical key exchange remains available; recorded traffic may be exposed to future decryption", level: high }
      protected_defeasible: { text: "Audit finding: hybrid key exchange observed, but classical fallback remains available", level: medium }
      protected:            { text: "Audit finding: no classical key-exchange fallback was observed in this probe", level: ok }
      unknown:              { text: "Audit finding: endpoint behavior was inconclusive for this probe", level: unknown }
    default: { text: "Audit finding: endpoint behavior was inconclusive for this probe", level: unknown }
  # The evidence badge checks CBOM shape, not readiness — word it so green can't read as "secure".
  badge_text:
    valid: "CBOM well-formed"
    invalid: "CBOM failed schema validation"
    unavailable: "Validator could not run"
    none: "No external validator for this output"
  # The posture banner is the verdict and owns the colour. This answers a different question,
  # whether the artifact parses, and at heading weight it competed with the banner.
  badge_inline: true
  highlights:
    - { label: "scan.status", find_prop: "qureddy:scan.status" }
  # #199: qureddy's own per-axis interpretation, shown verbatim in an Evaluation box under the
  # badge. The host reads these properties and renders them; it computes no verdict of its own.
  # qureddy 0.2.58 emits a purpose-built, protocol-neutral CISO evaluation
  # (scan.display.evaluation.*). Read that instead of assembling a view out of raw axis enums.
  #
  # Two of its fields close gaps the previous layout had:
  #   observed_facts     names the negotiated group ("TLS negotiated X25519MLKEM768 | Classical
  #                      alternative accepted: X25519"). "Key exchange: hybrid" alone is not
  #                      auditable; a reader cannot check it.
  #   recommended_action says what to do. The previous rows described state and stopped.
  #
  # Order is deliberate: what this is, then the two risk questions separately, then the evidence,
  # then the action, then severity, then the raw per-axis enums last for anyone who wants them.
  evaluation:
    title: "Evaluation"
    open: true
    headline_prop: "qureddy:scan.display.evaluation"
    axes:
      - { label: "Endpoint",                  find_prop: "qureddy:target.locator" }
      # The two independent questions. BreachSAFE/qureddy#453 records why one verdict cannot
      # rank them against each other.
      - { label: "Harvest-now-decrypt-later", find_prop: "qureddy:scan.display.evaluation.hndl_risk" }
      - { label: "Quantum protection",        find_prop: "qureddy:scan.display.evaluation.protection" }
      - { label: "Present-day hardening",     find_prop: "qureddy:scan.display.evaluation.hardening" }
      # The evidence behind the two lines above, so a reader can verify instead of trusting.
      - { label: "Observed",                  find_prop: "qureddy:scan.display.evaluation.observed_facts" }
      - { label: "Recommended action",        find_prop: "qureddy:scan.display.evaluation.recommended_action" }
      # Severity is what justifies amber over red, so it stays visible.
      - { label: "Highest severity",          find_prop: "qureddy:scan.highest_severity" }
      - { label: "Findings",                  find_prop: "qureddy:scan.finding_count" }
      # Raw per-axis values last.
      - { label: "PQC support",               find_prop: "qureddy:scan.pqc_support" }
      - { label: "Key exchange",              find_prop: "qureddy:scan.axis.key_exchange" }
      - { label: "Downgrade resistance",      find_prop: "qureddy:scan.axis.downgrade_resistance" }
      - { label: "Authentication",            find_prop: "qureddy:scan.axis.authentication" }
      - { label: "Protocol hygiene",          find_prop: "qureddy:scan.axis.protocol_hygiene" }
actions:
  # Preflight, now descriptor-declared argv instead of a hardcoded engine function (#5, #21).
  # stdin is closed by the engine so s_client does not hang; exit 0 = handshake completed.
  - label: "Test connection"
    argv: ["openssl", "s_client", "-connect", "{host}:{port}"]
    ok_if: { exit: 0 }
    timeout_s: 8
chains:
  - to: mint-oscal
    label: "Convert to OSCAL"
    pass_artifact_as: source_file
    with: { source: cbom }
    feature_flag: mint_oscal   # #67: hide the Convert button in the OSS base edition
  - to: breachsafe-evidence
    kind: pdf_export
    label: "Export Results"
    argv: [breachsafe-evidence, render, --profile, "{profile}", --request, "{request}", --scan-json, "{scan}", --cbom, "{inventory}", --pdf, "{pdf}", --result, "{result}", --log, "{log}", --zip, "{archive}"]
    profile: breachsafe/community
    request_file: request.json
    artifact_files: { inventory: scan.cdx.json, scan: scan.json }
    output_files: { pdf: report.pdf, result: report.result.json, log: pdf-render.log, archive: results.zip }
    request_artifacts:
      inventory: { request_key: cbom }
      scan: { request_key: scan_json }
    request_template:
      schema_version: breachsafe.report.request.community-single-scan/v1alpha1
      identity:
        report_id: pending
        name: Quantum Readiness Evidence Report
        generated_at: pending
        language: en-US
        organization_display_name: BreachSAFE EnXemble
        classification: COMMUNITY / EVIDENCE REPORT
      cbom: { media_type: application/vnd.cyclonedx+json, schema: cyclonedx:1.7, expected_sha256: pending }
      scan_json: { media_type: application/json, schema: qureddy.scan.v1, expected_sha256: pending }
      render_options: { page_size: a4, timezone: UTC, color_mode: color, accessibility_profile: none }
      allow_correlation_mismatch: false
    feature_flag: evidence_pdf
