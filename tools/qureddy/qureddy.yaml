schema_version: 1
order: 1
id: qureddy
standalone: true
title: "QuReddy: post-quantum TLS readiness"
description: >
  Find out whether a TLS endpoint is ready for the post-quantum transition. QuReddy runs a
  live handshake and reports exactly which key exchanges the server offers, whether any are
  post-quantum or hybrid, and what still rests on classical cryptography that a
  harvest-now-decrypt-later adversary could record today and decrypt once a cryptographically
  relevant quantum computer exists. The result is a CycloneDX 1.7 cryptographic bill of
  materials (CBOM) you can archive, diff across scans, and carry into compliance evidence.
  A full scan probes several handshakes, so it usually takes 30 seconds to 2 minutes.
brand:
  product: "BreachSAFE QuReddy"
  version: "0.2.13"
  url: "https://www.breachsafe.ai"
  repo: "https://github.com/breachsafe/qureddy"
inputs:
  - name: host
    type: text
    label: "host"
    placeholder: "pq.cloudflareresearch.com"
    info: "Required. Hostname, URL, or IP of the TLS endpoint."
    required: true
  - name: port
    type: int
    label: "port"
    default: 443
    min: 1
    max: 65535
    info: "TLS port. Defaults to 443."
  - name: format
    type: enum
    label: "output format"
    choices: [cbom, json, rich]
    default: cbom
    info: "cbom is a CycloneDX 1.7 CBOM (default, needed to chain to mint-oscal). json is the raw scan. rich is console."
    arg: "--format"
  - name: timeout
    type: int
    label: "per-probe timeout (s)"
    widget: slider
    min: 1
    max: 300
    default: 30
    info: "Seconds per probe (1 to 300, default 30). A full scan runs several probes, so total time is a multiple of this."
    arg: "--timeout"
  - name: sni
    type: text
    label: "SNI override"
    placeholder: "one.one.one.one"
    info: "Optional. Recommended for name-based virtual hosts and IP targets."
    group: advanced
    arg: "--sni"
  - name: retries
    type: int
    label: "retries"
    widget: slider
    min: 0
    max: 3
    default: 0
    info: "Extra retry attempts on transient failure (0 to 3, default 0)."
    group: advanced
    arg: "--retries"
  - name: retry_delay
    type: float
    label: "retry delay (s)"
    widget: slider
    min: 0.0
    max: 10.0
    default: 1.0
    info: "Seconds between retries (0.0 to 10.0, default 1.0)."
    group: advanced
    arg: "--retry-delay"
  - name: reproducible
    type: bool
    label: "reproducible"
    default: false
    info: "Omit per-run identity (serial, timestamps, scan id) for a stable, diffable digest."
    group: advanced
    flag: "--reproducible"
  - name: verbose
    type: bool
    label: "verbose (-v)"
    default: false
    info: "Emit per-subprocess start and finish diagnostics to the log."
    group: advanced
    flag: "-v"
run:
  base: [qureddy, scan, tls]
  positional_from: "{host}:{port}"
  artifact_from: stdout
  artifact_name: cbom.json
  timeout_s: 180
validate:
  # QuReddy has no external CLI validator; CycloneDX 1.7 schema-conformance is the honest check.
  # Run under the same interpreter as the app (has cyclonedx), not a bare 'python' that may be absent.
  # exit 0 = valid, 1 = rejected, 3 = validator could not run (missing dep / error) -> unavailable, never a false verdict.
  argv:
    - "{python}"
    - -c
    - "import sys\ntry:\n from cyclonedx.schema import SchemaVersion\n from cyclonedx.validation.json import JsonStrictValidator\n r=JsonStrictValidator(SchemaVersion.V1_7).validate_str(open('{artifact}').read())\nexcept Exception as e:\n sys.stderr.write('validator-infra-error: '+repr(e)); sys.exit(3)\nsys.exit(0 if r is None else 1)"
  timeout_s: 30
  badge_rule:
    pass_if: { exit: 0 }
    fail_if: { exit: 1 }
    otherwise: unavailable
render:
  primary: json
  highlights:
    - { label: "scan.status", find_prop: "qureddy:scan.status" }
chains:
  - to: mint-oscal
    label: "Convert to OSCAL"
    pass_artifact_as: source_file
    with: { source: cbom }
