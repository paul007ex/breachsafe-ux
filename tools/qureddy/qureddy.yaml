schema_version: 1
order: 1
id: qureddy
standalone: true
title: "HNDL Audit (TLS)"
run_label: "HNDL Audit (TLS)"
description: >
  Measures harvest-now-decrypt-later exposure at a TLS endpoint: whether the key exchange
  it offers is post-quantum, hybrid, or classical-only. Traffic captured today can be
  decrypted later once a cryptographically relevant quantum computer exists, so
  classical-only key exchange is a present-day confidentiality risk. Also reports the
  certificate signature algorithm and any legacy protocol offers. Output is a CycloneDX 1.7
  CBOM. A full scan runs several handshakes and takes 30 seconds to 2 minutes.
brand:
  product: "BreachSAFE QuReddy"
  version_cmd: ["qureddy", "--version"]   # single-source from the installed tool (#51)
  version: "0.2.x"                         # fallback if qureddy is not installed
  url: "https://www.breachsafe.io"
  repo: "https://github.com/breachsafe/qureddy"
inputs:
  - name: host
    type: text
    label: "host"
    default: "pq.cloudflareresearch.com"
    placeholder: "pq.cloudflareresearch.com"
    info: "Required. Hostname, URL, or IP of the TLS endpoint."
    required: true
  - name: port
    type: int
    label: "port"
    default: 443
    min: 1
    max: 65535
    info: "TLS port. Defaults to 443."
  - name: format
    type: enum
    label: "output format"
    choices: [cbom, json]
    default: cbom
    info: "cbom is a CycloneDX 1.7 CBOM (default, needed to chain to mint-oscal). json is the raw scan."
    arg: "--format"
  - name: timeout
    type: int
    label: "per-probe timeout (s)"
    widget: slider
    min: 1
    max: 300
    default: 30
    info: "Seconds per probe (1 to 300, default 30). A full scan runs several probes, so total time is a multiple of this."
    arg: "--timeout"
  - name: sni
    type: text
    label: "SNI override"
    placeholder: "one.one.one.one"
    info: "Optional. Recommended for name-based virtual hosts and IP targets."
    group: advanced
    arg: "--sni"
  - name: retries
    type: int
    label: "retries"
    widget: slider
    min: 0
    max: 3
    default: 0
    info: "Extra retry attempts on transient failure (0 to 3, default 0)."
    group: advanced
    arg: "--retries"
  - name: retry_delay
    type: float
    label: "retry delay (s)"
    widget: slider
    min: 0.0
    max: 10.0
    default: 1.0
    info: "Seconds between retries (0.0 to 10.0, default 1.0)."
    group: advanced
    arg: "--retry-delay"
  - name: reproducible
    type: bool
    label: "reproducible"
    default: false
    info: "Omit per-run identity (serial, timestamps, scan id) for a stable, diffable digest."
    group: advanced
    flag: "--reproducible"
  - name: verbose
    type: bool
    label: "verbose (-v)"
    default: false
    info: "Emit per-subprocess start and finish diagnostics to the log."
    group: advanced
    flag: "-v"
run:
  base: [qureddy, scan, tls]
  # Docker fallback: when qureddy isn't on PATH (e.g. the Docker deployment), the engine runs
  # this image instead (docker run --pull=always). Local installs use the PATH binary.
  image: ghcr.io/breachsafe/qureddy:latest
  positional_from: "{host}:{port}"
  artifact_from: stdout
  artifact_name: cbom.json
  timeout_s: 180
validate:
  # The external check depends on the output format (#43): only a CBOM has a schema to validate.
  # json (raw scan) and rich (console) have no schema validator, so they badge 'none' —
  # "no external validator", never a false green/red from running a CBOM validator on non-CBOM.
  by: [format]
  cases:
    json: null    # raw scan JSON: no external schema validator
    cbom:
      # CycloneDX 1.7 schema-conformance. Run under the same interpreter as the app (has
      # cyclonedx), not a bare 'python' that may be absent. exit 0 = valid, 1 = rejected,
      # 3 = validator could not run (missing dep / error) -> unavailable, never a false verdict.
      argv:
        - "{python}"
        - -c
        - "import sys\ntry:\n from cyclonedx.schema import SchemaVersion\n from cyclonedx.validation.json import JsonStrictValidator\n r=JsonStrictValidator(SchemaVersion.V1_7).validate_str(open('{artifact}').read())\nexcept Exception as e:\n sys.stderr.write('validator-infra-error: '+repr(e)); sys.exit(3)\nsys.exit(0 if r is None else 1)"
      timeout_s: 30
      badge_rule:
        pass_if: { exit: 0 }
        fail_if: { exit: 1 }
        otherwise: unavailable
render:
  primary: json
  # #1: readiness posture comes from the scan FINDINGS, shown separately from the evidence badge.
  # A schema-valid CBOM (green badge) does NOT mean the endpoint is PQC-ready — this banner says
  # what the scan actually found. Values are the qureddy Readiness enum.
  posture:
    from: "qureddy:scan.readiness"
    cases:
      quantum_vulnerable:  { text: "Quantum-vulnerable: classical-only key exchange (harvest-now, decrypt-later risk)", level: high }
      classically_weak:    { text: "Classically weak: broken or legacy primitives in use", level: high }
      transitional_hybrid: { text: "Transitional: hybrid post-quantum + classical key exchange", level: medium }
      quantum_safe:        { text: "Quantum-safe: post-quantum key exchange in use", level: ok }
      unknown:             { text: "Readiness unknown: the probe was inconclusive", level: unknown }
      not_applicable:      { text: "Readiness not applicable to this target", level: unknown }
    default: { text: "Readiness could not be determined", level: unknown }
  # The evidence badge checks CBOM shape, not readiness — word it so green can't read as "secure".
  badge_text:
    valid: "Evidence: CBOM is well-formed (CycloneDX 1.7)"
    invalid: "Evidence: CBOM failed schema validation"
    unavailable: "Evidence: validator could not run"
    none: "Evidence: no external validator for this output"
  highlights:
    - { label: "scan.status", find_prop: "qureddy:scan.status" }
actions:
  # Preflight, now descriptor-declared argv instead of a hardcoded engine function (#5, #21).
  # stdin is closed by the engine so s_client does not hang; exit 0 = handshake completed.
  - label: "Test connection"
    argv: ["openssl", "s_client", "-connect", "{host}:{port}"]
    ok_if: { exit: 0 }
    timeout_s: 8
chains:
  - to: mint-oscal
    label: "Convert to OSCAL"
    pass_artifact_as: source_file
    with: { source: cbom }
    feature_flag: mint_oscal   # #67: hide the Convert button in the OSS base edition
