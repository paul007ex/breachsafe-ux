schema_version: 1
order: 2
id: mint-oscal
feature_flag: mint_oscal   # #67: OSCAL is Pro-gated; BREACHSAFE_UX_MINT_OSCAL=false hides it
standalone: false   # reached via the QuReddy 'Convert to OSCAL' button, not its own tab
title: "mint-oscal: scan or CBOM to OSCAL POA&M"
description: >
  Turn a scan or a CBOM into audit-ready evidence. mint-oscal maps the cryptographic
  findings into an OSCAL Plan of Action and Milestones, the format that assessors and GRC
  tooling already consume, and checks it against the NIST oscal-cli so what you export is
  provably well-formed. Upload a QuReddy scan or a CycloneDX CBOM, or reach this straight
  from the QuReddy Convert to OSCAL button.
inputs:
  - name: source
    type: enum
    label: "source adapter (--from)"
    choices: [qureddy, cbom]
    default: cbom
    info: "Which adapter parses the upload: qureddy = a QuReddy scan.v1 JSON; cbom = a CycloneDX CBOM."
    arg: "--from"
  - name: source_file
    type: file
    label: "scan.json or cbom.json"
    info: "Required. A single .json file matching the selected source adapter."
    accept: [".json"]
    positional: true
    required: true
run:
  base: [mint-oscal, poam, generate]
  artifact_from: stdout
  artifact_name: poam.json
  timeout_s: 60
validate:
  argv: [docker, run, --rm, -v, "{share}:/w", "ghcr.io/metaschema-framework/oscal-cli:latest", validate, /w/poam.json]
  timeout_s: 180
  badge_rule:
    # #14: the validator's exit code must gate the verdict, or a nonzero-exit run whose stdout
    # happens to contain "is valid" would false-green. Docker/infra failures -> unavailable; a
    # real pass requires exit 0 as well as the "is valid" text.
    unavailable_if: { stdout_contains_any: ["Cannot connect to the Docker daemon", "Unable to find image"] }
    pass_if: { stdout_contains: "is valid", stdout_not_contains: "is invalid", exit: 0 }
    otherwise: invalid
    fail_detail_grep: ""
render:
  primary: json
  highlights:
    - { label: readiness, find_prop: readiness }
    - { label: "mapping-confidence", find_prop: "mapping-confidence" }
