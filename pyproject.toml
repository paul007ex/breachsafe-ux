[project]
name = "breachsafe-ux"
version = "0.3.2"
description = "Config-driven single-tool UX host for BreachSAFE tools (one YAML per tool)"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["gradio>=6", "pyyaml>=6", "jsonschema>=4", "cyclonedx-python-lib[json-validation]>=11,<12"]

[project.scripts]
breachsafe-ux = "breachsafe_ux.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/breachsafe_ux"]

[project.optional-dependencies]
# Build-quality toolchain, mirrored from qureddy and locked in uv.lock. CI installs via
# `uv sync --locked --extra dev` and runs every gate through `uv run --locked`.
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-rerunfailures>=14.0",
    "ruff>=0.15,<0.17",
    "mypy>=1.10",
    "bandit>=1.7",
    "pip-audit>=2.7",
    "deptry>=0.20",
    "reuse[charset-normalizer]>=4.0",
    # MAX code-quality + architecture gates (#127). All fail-closed; all run via `uv run --locked`.
    "import-linter>=2.0",   # architecture: MVC layering + engine/model UI-free contracts
    "xenon>=0.9",           # cyclomatic-complexity ceiling (radon-backed)
    "refurb>=2.0",          # modernization / idiom lint (fails on any finding)
    "vulture>=2.11",        # dead-code detection (min-confidence 80 + allowlist)
    "pylint>=3.0",          # duplicate-code (R0801) cross-file clone detection
    "interrogate>=1.7",     # docstring-coverage floor
    "diff-cover>=9.0",      # changed-line coverage gate (vs origin/main)
    "allure-pytest>=2.13",  # rich test-report artifact
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.format]
exclude = ["**/*.md"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "C4", "UP", "N", "S", "SIM", "TCH", "RUF", "PL", "PT",
    "RET", "ARG", "DTZ", "PTH", "ERA", "INP", "BLE", "SLF",
    # "D" (pydocstyle/google) — adopted next for full qureddy parity; tracked in a follow-up.
]
ignore = [
    "E501",     # line-too-long — handled by the formatter
    "PLR0913",  # too-many-arguments
    "PLR0917",  # too-many-positional-arguments
    # UX-host idioms (the pre-strict ignore list, kept with reasons):
    "B008",     # gradio uses gr.Progress() as an arg default (framework idiom)
    "BLE001",   # validator/artifact paths deliberately catch broadly to fail CLOSED
    "PLW1510",  # subprocess results are inspected manually (badge logic), never via check=
    "SIM102",   # nested-if kept for readability of the badge/render code
    "ISC004",   # explicit string concatenation kept for readability
    "S603",     # subprocess is always argv (no shell) by design; bandit B603 still runs
    "PLR0911",  # the badge state machine is guard-clause returns (run_descriptor/_validate)
]


[tool.ruff.lint.pylint]
max-statements = 50

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",     # asserts are the point of tests
    "PLR2004",  # magic numbers are fine in tests
    "ARG",      # unused args in fixtures/params
    "SLF001",   # tests exercise private helpers (_render, _posture, _validate)
    "INP001",   # tests/ is intentionally not a package
    "PT018",    # composite asserts read fine in these tests
    "PLC0415",  # deliberate in-function imports (defer gradio import cost)
    "S108",     # /tmp paths are test literals, not real temp-file usage
    "PT006",    # parametrize name style is a matter of taste here
]
"scripts/**/*.py" = ["INP001", "S603", "S607", "S202"]  # standalone CLIs; subprocess by design; extractall is validated/filtered

[tool.mypy]
python_version = "3.12"
strict = true
# Gradual strict: the whole-codebase annotation backfill (untyped defs in the Gradio shell,
# any-generics, return-any) is tracked as a follow-up for full qureddy parity. These three are
# relaxed for now; every other strict check (redundant-cast, unused-ignores, no-implicit-
# optional, strict-equality, extra-checks, check-untyped-defs, ...) stays ON and catches bugs.
disallow_untyped_defs = false
disallow_untyped_calls = false
disallow_any_generics = false
warn_return_any = false
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_reexport = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
extra_checks = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
# gradio 6.x ships py.typed, so mypy resolves gr.Button but not its event methods (.click/.then)
# which gradio attaches at runtime -> false "has no attribute" errors. follow_imports=skip treats
# gradio as untyped (Any) at the UI boundary, which is what ignore_missing_imports did before 6.x
# started shipping types. Keeps CI (cold) and local (incremental) in agreement.
module = ["gradio.*"]
follow_imports = "skip"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["yaml.*", "jsonschema.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--reruns=3",
    "--reruns-delay=1",
    "--alluredir=.allure-results",  # #127: rich test-report artifact (uploaded in CI)
]

[tool.coverage.run]
branch = true
source = ["breachsafe_ux"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
# Floor set below the current ~74-75% (with the live-integration suite skipped, as in CI) so the
# gate holds today; ratchet toward qureddy's 90 as coverage grows. Tracked in #89.
fail_under = 70
show_missing = true

[tool.bandit]
exclude_dirs = ["tests"]
# B202 (tarfile.extractall): our calls are safe — zip members are path-validated and tar uses
# filter="data". bandit pattern-matches extractall regardless, so skip it project-wide.
skips = ["B202"]

[tool.deptry]
# _release_support is the shared script-local helper module (scripts/_release_support.py),
# imported by release_gate.py and run_secret_scan.py; it is first-party, not a dependency.
known_first_party = ["breachsafe_ux", "_release_support"]
package_module_name_map = { "breachsafe-ux" = "breachsafe_ux", "pyyaml" = "yaml" }

[tool.deptry.per_rule_ignores]
# DEP002 = declared-but-not-imported. These are CLI dev tools, plus cyclonedx-python-lib
# which the qureddy descriptor's validator imports at RUNTIME via `{python} -c ...` (subprocess),
# not from any src module.
DEP002 = ["ruff", "mypy", "bandit", "pip-audit", "deptry", "reuse", "pytest", "pytest-cov", "pytest-rerunfailures", "cyclonedx-python-lib", "import-linter", "xenon", "refurb", "vulture", "pylint", "interrogate", "diff-cover", "allure-pytest"]

# --- Architecture contract (#127): import-linter. `uv run --locked lint-imports`. -----------
# Encodes the repo's MVC + engine/theme layering (see CLAUDE.md "Repo map"): the model
# (resolve.py, _render.py) must not import the view (render.py) or the controller (app.py), and
# the engine/model layer must stay Gradio-free (only app.py + brand.py may import gradio).
[tool.importlinter]
root_package = "breachsafe_ux"
include_external_packages = true  # required to forbid the external `gradio` below the UI edge

[[tool.importlinter.contracts]]
name = "MVC layering: model < engine < view/theme < controller"
type = "layers"
# Highest first. A higher layer may import lower ones; a lower layer may never import a higher
# one, and modules joined with ` | ` are independent (may not import each other).
layers = [
    "breachsafe_ux.app",                          # controller (top)
    "breachsafe_ux.render | breachsafe_ux.brand",  # view | theme
    "breachsafe_ux.facade",                       # engine
    "breachsafe_ux.resolve | breachsafe_ux._render",  # model (bottom)
]

[[tool.importlinter.contracts]]
name = "Engine and model stay UI-free (no gradio below the controller/theme edge)"
type = "forbidden"
source_modules = [
    "breachsafe_ux.facade",
    "breachsafe_ux.resolve",
    "breachsafe_ux._render",
    "breachsafe_ux.render",
]
forbidden_modules = ["gradio"]

# --- Docstring coverage (#127): interrogate. `uv run --locked interrogate src/breachsafe_ux`. -
[tool.interrogate]
# Floor pinned at the current level (74.7% after the #127 helper-extraction refactor added
# docstrings). Ratchet upward alongside the coverage floor (#89); never lower it.
fail-under = 74
ignore-init-method = true
ignore-module = false
ignore-nested-functions = false
