[project]
name = "breachsafe-ux"
version = "0.2.0"
description = "Config-driven, honest single-tool UX harness for BreachSAFE tools (one YAML per tool)"
requires-python = ">=3.12"
license = "PolyForm-Noncommercial-1.0.0"
dependencies = ["gradio>=6", "pyyaml>=6", "cyclonedx-python-lib[json-validation]>=11,<12"]

[project.scripts]
breachsafe-ux = "breachsafe_ux.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/breachsafe_ux"]

[dependency-groups]
dev = ["pytest>=8"]